<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - IEEE SB CEK</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/auth.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div id="loading" style="
  position:fixed; inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  font-family:'Poppins',sans-serif;
  color:#a855f7;
  font-size:1.2rem;
">
  ⚡ Loading...
</div>  

<div class="auth-page">
  <div class="auth-box dashboard-box">

    <div class="auth-logo">⚡</div>
    <h2>IEEE SB CEK</h2>
    <p class="auth-subtitle">Admin Dashboard</p>
    <p class="form-label welcome-msg" id="welcomeMsg">Welcome, Administrator!</p>

<div class="dashboard-actions" id="mainMenu">

  <button class="dash-btn" id="eventsBtn" onclick="showSection('events')">
    <i class="fa-solid fa-calendar-plus"></i> Manage Events
  </button>

  <button class="dash-btn" id="execomBtn" onclick="showSection('execom')">
    <i class="fa-solid fa-users"></i> Manage ExeCom
  </button>

  <button class="dash-btn" id="announcementBtn" onclick="showSection('announcements')">
    <i class="fa-solid fa-bullhorn"></i> Announcements
  </button>

  <button class="dash-btn logout" onclick="logout()">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>

</div>

    <!-- EVENTS SECTION -->
    <div class="dash-section hidden" id="section-events">
      <h3>📅 Manage Events</h3>
      <div class="input-group">
        <i class="fa-solid fa-heading"></i>
        <input type="text" id="eventName" placeholder="Event Name"/>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-calendar"></i>
        <input type="text" id="eventDate" placeholder="Event Date"/>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-tag"></i>
        <select id="eventStatus">
          <option value="upcoming">Upcoming</option>
          <option value="ongoing">Ongoing</option>
          <option value="past">Past</option>
        </select>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-align-left"></i>
        <input type="text" id="eventDesc" placeholder="Short Description"/>
      </div>
      <button class="login-btn" id="addEventBtn">Add Event</button>
      <div class="saved-list" id="eventsList"></div>
      <button class="dash-btn small" onclick="hideSection('events')">← Back</button>
    </div>

    <!-- EXECOM SECTION -->
    <div class="dash-section hidden" id="section-execom">
      <h3>👥 Manage ExeCom</h3>
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="memberName" placeholder="Member Name"/>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-id-badge"></i>
        <input type="text" id="memberRole" placeholder="Role"/>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-building"></i>
        <input type="text" id="memberDept" placeholder="Department"/>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-calendar"></i>
        <select id="memberYear">
          <option value="2026">2026</option>
          <option value="2025">2025</option>
        </select>
      </div>
      <button class="login-btn" id="addMemberBtn">Add Member</button>
      <div class="saved-list" id="membersList"></div>
      <button class="dash-btn small" onclick="hideSection('execom')">← Back</button>
    </div>

    <!-- ANNOUNCEMENTS SECTION -->
    <div class="dash-section hidden" id="section-announcements">
      <h3>📢 Announcements</h3>
      <div class="input-group">
        <i class="fa-solid fa-heading"></i>
        <input type="text" id="annTitle" placeholder="Announcement Title"/>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-align-left"></i>
        <input type="text" id="annText" placeholder="Announcement Details"/>
      </div>
      <button class="login-btn" id="addAnnBtn">Post Announcement</button>
      <div class="saved-list" id="annList"></div>
      <button class="dash-btn small" onclick="hideSection('announcements')">← Back</button>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUqi6c979HdojNMtoclUeEyiz4ubRab1U",
    authDomain: "ieee-ce-kgr-website.firebaseapp.com",
    projectId: "ieee-ce-kgr-website",
    storageBucket: "ieee-ce-kgr-website.firebasestorage.app",
    messagingSenderId: "557381248492",
    appId: "1:557381248492:web:5329b65ddb0d2da8be8cc9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
// get role
  const role = localStorage.getItem("role");

  // hide all first
  const allButtons = ["eventsBtn", "execomBtn", "announcementBtn"];

  allButtons.forEach(id => {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
  });
// define permissions
  const permissions = {
  admin: ["eventsBtn","execomBtn","announcementBtn"], 
  chair: ["eventsBtn","execomBtn","announcementBtn"],
  vicechair: ["eventsBtn","execomBtn","announcementBtn"],
  secretary: ["announcementBtn"],
  treasurer: ["eventsBtn"],
  webmaster: ["eventsBtn","execomBtn"],
  coordinator: ["eventsBtn"],
  media: ["announcementBtn"],
  jointsecretary: ["eventsBtn","announcementBtn"]
  };
// show allowed buttons
  if (permissions[role]) {
  permissions[role].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "block";
  });
  }

  // check if logged in
  onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  // ✅ user is logged in
  document.getElementById("loading").style.display = "none";

  const role = (localStorage.getItem("role") || "").toLowerCase().trim();

  const allButtons = ["eventsBtn", "execomBtn", "announcementBtn"];

  allButtons.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });

  if (permissions[role]) {
    permissions[role].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = "block";
    });
  }

  document.getElementById("welcomeMsg").textContent =
    `Welcome (${role})`;
});

  // logout
  window.logout = async () => {
    await signOut(auth);
    localStorage.clear();
    window.location.href = 'auth.html';
  };

  // show/hide sections
  window.showSection = (section) => {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('section-' + section).classList.remove('hidden');
    loadData(section);
  };

  window.hideSection = (section) => {
    document.getElementById('mainMenu').style.display = 'flex';
    document.getElementById('section-' + section).classList.add('hidden');
  };

  // ADD EVENT
  document.getElementById('addEventBtn').addEventListener('click', async () => {
    const name = document.getElementById('eventName').value;
    const date = document.getElementById('eventDate').value;
    const status = document.getElementById('eventStatus').value;
    const desc = document.getElementById('eventDesc').value;

    if (!name || !date) { alert('Fill in event name and date!'); return; }

    await addDoc(collection(db, 'events'), { name, date, status, desc, createdAt: new Date() });
    document.getElementById('eventName').value = '';
    document.getElementById('eventDate').value = '';
    document.getElementById('eventDesc').value = '';
    alert('Event added to database!');
    loadData('events');
  });

  // ADD MEMBER
  document.getElementById('addMemberBtn').addEventListener('click', async () => {
    const name = document.getElementById('memberName').value;
    const role = document.getElementById('memberRole').value;
    const dept = document.getElementById('memberDept').value;
    const year = document.getElementById('memberYear').value;

    if (!name || !role) { alert('Fill in name and role!'); return; }

    await addDoc(collection(db, 'execom'), { name, role, dept, year, createdAt: new Date() });
    document.getElementById('memberName').value = '';
    document.getElementById('memberRole').value = '';
    document.getElementById('memberDept').value = '';
    alert('Member added to database!');
    loadData('execom');
  });

  // ADD ANNOUNCEMENT
  document.getElementById('addAnnBtn').addEventListener('click', async () => {
    const title = document.getElementById('annTitle').value;
    const text = document.getElementById('annText').value;

    if (!title) { alert('Fill in announcement title!'); return; }

    await addDoc(collection(db, 'announcements'), { title, text, date: new Date().toLocaleDateString(), createdAt: new Date() });
    document.getElementById('annTitle').value = '';
    document.getElementById('annText').value = '';
    alert('Announcement posted to database!');
    loadData('announcements');
  });

  // LOAD DATA from Firestore
  async function loadData(section) {
    if (section === 'events') {
      const snapshot = await getDocs(collection(db, 'events'));
      const list = document.getElementById('eventsList');
      list.innerHTML = snapshot.empty ? '<p style="color:var(--text-dim);font-size:0.85rem;">No events added yet!</p>' : '';
      snapshot.forEach(d => {
        const e = d.data();
        list.innerHTML += `<div class="saved-item">
          <span>📅 ${e.name} — ${e.date} (${e.status})</span>
          <button onclick="deleteItem('events','${d.id}','events')">✕</button>
        </div>`;
      });
    }

    if (section === 'execom') {
      const snapshot = await getDocs(collection(db, 'execom'));
      const list = document.getElementById('membersList');
      list.innerHTML = snapshot.empty ? '<p style="color:var(--text-dim);font-size:0.85rem;">No members added yet!</p>' : '';
      snapshot.forEach(d => {
        const m = d.data();
        list.innerHTML += `<div class="saved-item">
          <span>👤 ${m.name} — ${m.role} (${m.year})</span>
          <button onclick="deleteItem('execom','${d.id}','execom')">✕</button>
        </div>`;
      });
    }

    if (section === 'announcements') {
      const snapshot = await getDocs(collection(db, 'announcements'));
      const list = document.getElementById('annList');
      list.innerHTML = snapshot.empty ? '<p style="color:var(--text-dim);font-size:0.85rem;">No announcements yet!</p>' : '';
      snapshot.forEach(d => {
        const a = d.data();
        list.innerHTML += `<div class="saved-item">
          <span>📢 ${a.title} — ${a.date}</span>
          <button onclick="deleteItem('announcements','${d.id}','announcements')">✕</button>
        </div>`;
      });
    }
  }

  // DELETE from Firestore
  window.deleteItem = async (colName, docId, section) => {
    await deleteDoc(doc(db, colName, docId));
    loadData(section);
  };
</script>
</body>
</html>
