<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - IEEE SB CEK</title>
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-logo">⚡</span>
      <span class="nav-title">IEEE SB</span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="execom.html">ExeCom</a></li>
      <li><a href="achievements.html">Achievements</a></li>
      <li><a href="societies.html">Societies</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="auth.html" class="btn-login active">Login</a></li>
    </ul>
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="auth-page">
    <div class="auth-box">

      <div class="auth-logo">⚡</div>
      <h2>IEEE SB CEK</h2>
      <p class="auth-subtitle">Login to access your dashboard</p>

      <div class="role-selector">
        <button class="role-btn active" id="btnAdmin">Admin Login</button>
        <button class="role-btn" id="btnExecom">ExeCom Login</button>
      </div>

      <!-- admin form -->
      <div class="login-form" id="adminForm">
        <p class="form-label">Admin — Full access to manage the website</p>
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" placeholder="Admin Email" id="adminEmail"/>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Password" id="adminPass"/>
        </div>
        <button class="login-btn" id="adminLoginBtn">Login as Admin</button>
        <p class="login-hint" id="adminError"></p>
      </div>

      <!-- execom form -->
      <div class="login-form hidden" id="execomForm">
        <p class="form-label">ExeCom — Access based on your role</p>
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" placeholder="Your Email" id="execomEmail"/>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Password" id="execomPass"/>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-id-badge"></i>
          <select id="execomRole">
            <option value="">Select your role</option>
            <option value="chair">Chairperson</option>
            <option value="vicechair">Vice Chairperson</option>
            <option value="secretary">Secretary</option>
            <option value="treasurer">Treasurer</option>
            <option value="webmaster">Webmaster</option>
            <option value="coordinator">Event Coordinator</option>
          </select>
        </div>
        <button class="login-btn" id="execomLoginBtn">Login as ExeCom</button>
        <p class="login-hint" id="execomError"></p>
      </div>

      <a href="index.html" class="back-home">← Back to Home</a>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDUqi6c979HdojNMtoclUeEyiz4ubRab1U",
      authDomain: "ieee-ce-kgr-website.firebaseapp.com",
      projectId: "ieee-ce-kgr-website",
      storageBucket: "ieee-ce-kgr-website.firebasestorage.app",
      messagingSenderId: "557381248492",
      appId: "1:557381248492:web:5329b65ddb0d2da8be8cc9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // hamburger
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    // tab switching
    document.getElementById('btnAdmin').addEventListener('click', () => {
      document.getElementById('btnAdmin').classList.add('active');
      document.getElementById('btnExecom').classList.remove('active');
      document.getElementById('adminForm').classList.remove('hidden');
      document.getElementById('execomForm').classList.add('hidden');
    });

    document.getElementById('btnExecom').addEventListener('click', () => {
      document.getElementById('btnExecom').classList.add('active');
      document.getElementById('btnAdmin').classList.remove('active');
      document.getElementById('execomForm').classList.remove('hidden');
      document.getElementById('adminForm').classList.add('hidden');
    });

    // admin login
    document.getElementById('adminLoginBtn').addEventListener('click', async () => {
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPass').value;
      const error = document.getElementById('adminError');

      if (!email || !pass) {
        error.textContent = 'Please fill in all fields!';
        return;
      }

      try {
        error.textContent = 'Logging in...';
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        localStorage.setItem('role', 'admin');
        localStorage.setItem('name', userCredential.user.email);
        localStorage.setItem('uid', userCredential.user.uid);
        window.location.href = 'dashboard.html';
      } catch (err) {
        error.textContent = 'Wrong email or password. Try again!';
      }
    });

    // execom login
    document.getElementById('execomLoginBtn').addEventListener('click', async () => {
      const email = document.getElementById('execomEmail').value;
      const pass = document.getElementById('execomPass').value;
      const role = document.getElementById('execomRole').value;
      const error = document.getElementById('execomError');

      if (!email || !pass || !role) {
        error.textContent = 'Please fill in all fields!';
        return;
      }

      try {
        error.textContent = 'Logging in...';
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        localStorage.setItem('role', role);
        localStorage.setItem('name', userCredential.user.email);
        localStorage.setItem('uid', userCredential.user.uid);
        alert('Welcome! Logged in as ' + role);
        window.location.href = 'dashboard.html';
      } catch (err) {
        error.textContent = 'Wrong email or password. Try again!';
      }
    });
  </script>

  <script src="JS/main.js"></script>
</body>
</html>
